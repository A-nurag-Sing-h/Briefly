<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefly | Your Personal Exam News</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <header>
            <h1>Briefly</h1>
            <p>Personalized News for Serious Aspirants</p>
        </header>

        <div class="auth-box">
            <div class="tabs">
                <button id="loginTab" class="active">Login</button>
                <button id="registerTab">Register</button>
            </div>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Enter Dashboard</button>
            </form>

            <form id="registerForm" class="hidden">
                <input type="text" id="regName" placeholder="Full Name" required>
                <input type="email" id="regEmail" placeholder="Email Address" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <div class="interests-section">
                    <p>Select Initial Interests:</p>
                    <div class="interest-chips">
                        <label><input type="checkbox" value="defense"> Defense</label>
                        <label><input type="checkbox" value="technology"> Tech</label>
                        <label><input type="checkbox" value="economy"> Economy</label>
                        <label><input type="checkbox" value="politics"> Politics</label>
                    </div>
                </div>
                <button type="submit">Create Account</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
